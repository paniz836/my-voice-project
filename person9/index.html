<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Player</title>

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:90%;
            max-width:450px;
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,.15);
            text-align:center;
        }

        img{
            width:100%;
            aspect-ratio:1/1;
            object-fit:cover;
            border-radius:10px;
            margin-bottom:20px;
        }

        audio{
            width:100%;
        }
    </style>
</head>

<body>

<div class="container">

    <img src="photo.jpg" alt="Photo">

    <audio controls>
        <source src="voice.mp3" type="audio/mpeg">
        مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
    </audio>

</div>

</body>
</html>
